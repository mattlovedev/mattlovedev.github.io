name: Deploy to GitHub Pages

# Only site/ is published - anything else in the repo (README, notes)
# never reaches mattlove.dev. Pushes that don't touch site/ or this
# workflow skip the deploy entirely.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: # manual redeploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write # required by deploy-pages - no stored secrets

# One deploy at a time; a newer push waits rather than cancelling
# a deploy that's already partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
